name: Prepare GH-Leather site assets for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "CNAME"
      - ".github/scripts/build_demo_before.py"
      - ".github/workflows/prepare-gh-pages-assets.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-leather-pages-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build missing comparison photos and local icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python .github/scripts/build_demo_before.py
      - name: Verify complete static files
        run: |
          node --check app.js
          python .github/scripts/check_static_site.py
          test "$(cat CNAME)" = "ghleather.ru"
      - name: Publish generated assets to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/studio_*_before.jpg images/studio_*_after.jpg images/lucide.min.js
          if ! git diff --cached --quiet; then
            git commit -m "Build local assets for GitHub Pages"
            git push origin HEAD:main
          else
            echo "Generated assets are already current."
          fi
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --output /tmp/pages-rebuild-response.txt --write-out '%{http_code}' \
            --request POST --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "GitHub Pages rebuild status: $code"
          case "$code" in
            201|202|204) echo "Pages rebuild requested." ;;
            *) echo "::warning::Pages rebuild API unavailable; check Settings > Pages." ;;
          esac
