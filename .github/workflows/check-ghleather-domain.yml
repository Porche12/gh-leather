name: Check GH-Leather domain registration and public DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-ghleather-domain.yml"
      - ".github/scripts/check-beget-registration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check domain registration in Beget (read only)
        env:
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
        run: python .github/scripts/check-beget-registration.py
      - name: Check authoritative DNS delegation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
          echo "PUBLIC NS:"
          dig +noall +answer NS ghleather.ru @1.1.1.1
          echo "PUBLIC A:"
          dig +noall +answer A ghleather.ru @1.1.1.1

          echo "PARENT .RU NS:"
          dig +short NS ghleather.ru @a.dns.ripn.net || true
          echo "AUTHORITATIVE BEGET SOA/A:"
          dig +short SOA ghleather.ru @ns1.beget.com || true
          dig +short A ghleather.ru @ns1.beget.com || true
      - name: Read GitHub Pages site status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --max-time 20 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
          | python -c 'import json,sys; d=json.load(sys.stdin); print("Pages:",{k:d.get(k) for k in ("status","cname","html_url","build_type","https_enforced","pending_domain_unverified_at","protected_domain_state")}); print("Pages source:",d.get("source")); print("Pages HTTPS certificate:",d.get("https_certificate"))'

