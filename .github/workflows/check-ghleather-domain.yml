name: Check GH-Leather domain registration and public DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-ghleather-domain.yml"
      - ".github/scripts/check-beget-registration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check domain registration in Beget (read only)
        env:
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
        run: python .github/scripts/check-beget-registration.py
      - name: Check authoritative DNS delegation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
          echo "PUBLIC NS:"
          dig +noall +answer NS ghleather.ru @1.1.1.1
          echo "PUBLIC A:"
          dig +noall +answer A ghleather.ru @1.1.1.1
