name: Check GH-Leather DNS and HTTPS

on:
  push:
    branches: [main]
    paths:
      - "CNAME"
      - ".github/scripts/point-beget-dns-to-github-pages.py"
      - ".github/scripts/ensure-pages-https.py"
      - ".github/tests/**"
      - ".github/workflows/point-beget-domain-to-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: '19 */2 * * *'

permissions:
  contents: read
  pages: read

concurrency:
  group: ghleather-domain-dns
  cancel-in-progress: false

jobs:
  beget-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate domain configuration
        run: |
          test "$(cat CNAME)" = "ghleather.ru"
          python -m py_compile .github/scripts/point-beget-dns-to-github-pages.py .github/scripts/ensure-pages-https.py
          python -m unittest discover -s .github/tests
      - name: Install DNS verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
      - name: Confirm registry delegation
        id: registry
        shell: bash
        run: |
          echo "Nameservers from public DNS:"
          dig +noall +answer NS ghleather.ru @1.1.1.1 || true
          nameservers="$(dig +short NS ghleather.ru @1.1.1.1 | tr -d '\r')"
          if [ -z "$nameservers" ]; then
            echo "delegated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ghleather.ru has no public NS delegation. Waiting on domain registry publication."
          else
            echo "delegated=true" >> "$GITHUB_OUTPUT"
            echo "Public NS delegation found:"
            echo "$nameservers"
          fi
      - name: Configure GitHub Pages apex A records without touching mail
        if: steps.registry.outputs.delegated == 'true'
        env:
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
        run: python .github/scripts/point-beget-dns-to-github-pages.py
      - name: Verify apex certificate and HTTPS enforcement
        if: ${{ always() && steps.registry.outputs.delegated == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ensure-pages-https.py --verify-only
      - name: Check public DNS and GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Public A records:"
          dig +short A ghleather.ru @1.1.1.1 || true
          echo "GitHub Pages apex certificate status:"
          pages_json="$(curl -fsSL --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          printf '%s' "$pages_json" | python -c 'import json,sys; d=json.load(sys.stdin); c=d.get("https_certificate") or {}; print("domain="+str(d.get("cname"))+"; HTTPS enforced="+str(d.get("https_enforced"))+"; certificate="+str(c.get("state","not issued")))'
          certificate_state="$(printf '%s' "$pages_json" | python -c 'import json,sys; d=json.load(sys.stdin); c=d.get("https_certificate") or {}; print(str(c.get("state") or "not issued").lower())')"
          https_enforced="$(printf '%s' "$pages_json" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("https_enforced"))).lower())')"
          if [ "$certificate_state" = "errored" ] || [ "$certificate_state" = "failed" ]; then
            echo "::error::GitHub Pages reports a certificate error for the apex domain."
            exit 1
          fi
          if [ "$certificate_state" != "approved" ]; then
            echo "::warning::The apex certificate is still provisioning. This scheduled check will retry later."
            exit 0
          fi
          if [ "$https_enforced" != "true" ]; then
            echo "::error::The apex certificate is approved, but Enforce HTTPS is off in Settings > Pages."
            exit 1
          fi
          echo "Public HTTPS:"
          if curl -fsSL --max-time 15 https://ghleather.ru/ -o /tmp/ghleather-live.html \
               && grep -qi 'GH-Leather' /tmp/ghleather-live.html; then
            echo "LIVE: https://ghleather.ru/"
          else
            echo "::error::HTTPS is not available with a valid certificate."
            exit 1
          fi
